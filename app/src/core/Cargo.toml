[package]
name = "bluecaster-core-exe"
description = "bluecaster-core.exe: the resident BlueCaster process (tray, IPC) and the command line"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "bluecaster-core"
path = "src/main.rs"

[dependencies]
bluecaster-core.workspace = true
bt-host.workspace = true
# cli.rs: -u (UsbSelector)
hci-transport.workspace = true
codec = { workspace = true, features = ["default"] }
ipc.workspace = true
win-sys.workspace = true
audio-capture.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde.workspace = true
serde_json.workspace = true
ctrlc = "3"
# logging.rs: daily log files, local timestamps
tracing-appender = "0.2"
time = { version = "0.3", features = ["local-offset"] }
# bundle.rs: the diagnostic bundle's .zip
flate2 = "1"
crc32fast = "1"
base64 = "0.22"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "net", "time", "macros", "io-util"] }
tray-icon = "0.26"
tao = "0.37"

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
