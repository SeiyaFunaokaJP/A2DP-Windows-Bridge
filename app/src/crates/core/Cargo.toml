[package]
name = "a2dpwb-core"
description = "A2DPWB's core: the streaming state machine, Bluetooth stack lifecycle, profiles, settings, devices"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lib]
name = "a2dpwb_core"

[dependencies]
bt-host.workspace = true
# LE Audio (experimental): plans, SDU sets, --le-sim-volume, the MCP backend
le-audio.workspace = true
hci-transport.workspace = true
codec = { workspace = true, features = ["default"] }
pipeline.workspace = true
audio-capture.workspace = true
win-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
# update.rs (and firmware.rs): GitHub Releases API (rustls, the system proxy as v1's WinHTTP),
# version precedence, and the local date of the daily check
ureq = { version = "3.3", default-features = false, features = ["rustls", "win-system-proxy"] }
semver = "1"
time = { version = "0.3", features = ["local-offset"] }
# receiver.rs: the broadcast address of every IPv4 network (discovery)
if-addrs = "0.15"
# le_media.rs: LE Audio MCP, the Windows media session (WinRT, safe API)
windows = { version = "0.62", features = ["Foundation", "ApplicationModel", "Media_Control"] }
# firmware.rs: checks the Realtek files fetched from linux-firmware
sha2 = "0.10"

[lints]
workspace = true
