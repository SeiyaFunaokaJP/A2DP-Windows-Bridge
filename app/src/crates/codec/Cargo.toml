[package]
name = "codec"
description = "A2DP codecs: the Encoder trait, the Rust SBC encoder, wrappers of the C encoders, codec information and capability negotiation"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["ldac", "aptx", "aptx-adaptive", "aac", "lhdcv5", "opus", "lc3"]
ldac = ["dep:ldac-sys"]
aptx = ["dep:openaptx-sys"]
# Pure-Rust aptX Adaptive encoder (vendored, MIT)
aptx-adaptive = ["dep:aptx-adaptive"]
aac = ["dep:fdkaac-sys"]
lhdcv5 = ["dep:lhdcv5-sys"]
opus = ["dep:opus-sys"]
# LC3 for LE Audio (not an A2DP codec)
lc3 = ["dep:lc3-sys"]

[dependencies]
thiserror.workspace = true
serde.workspace = true
tracing.workspace = true
ldac-sys = { path = "../ldac-sys", optional = true }
openaptx-sys = { path = "../openaptx-sys", optional = true }
aptx-adaptive = { workspace = true, optional = true }
fdkaac-sys = { path = "../fdkaac-sys", optional = true }
lhdcv5-sys = { path = "../lhdcv5-sys", optional = true }
opus-sys = { path = "../opus-sys", optional = true }
lc3-sys = { path = "../lc3-sys", optional = true }

[dev-dependencies]
btstack-sys = { workspace = true, features = ["sbc-reference"] }
proptest = "1"

[lints]
workspace = true
