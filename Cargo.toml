[workspace]
resolver = "3"
members = [
    "app/src/crates/btstack-sys",
    "app/src/crates/ldac-sys",
    "app/src/crates/openaptx-sys",
    "app/src/crates/fdkaac-sys",
    "app/src/crates/lhdcv5-sys",
    "app/src/crates/opus-sys",
    "app/src/crates/lc3-sys",
    "app/src/crates/win-sys",
    "app/src/crates/hci-transport",
    "app/src/crates/codec",
    "app/src/crates/audio-capture",
    "app/src/crates/le-audio",
    "app/src/crates/bt-host",
    "app/src/crates/pipeline",
    "app/src/crates/core",
    "app/src/crates/ipc",
    "app/src/core",
    "app/src/driver",
    "app/src/ui/src-tauri",
]
# Vendored aptX Adaptive encoder: a path dependency of codec, kept out of the
# workspace (its unit tests read upstream's reference vectors, not vendored)
exclude = ["app/src/crates/aptx-adaptive"]

[workspace.package]
version = "2.0.2-beta.11"
edition = "2024"
rust-version = "1.90"
license = "Apache-2.0 OR MIT"
repository = "https://github.com/SeiyaFunaokaJP/A2DP-Windows-Bridge"
# Nothing here goes to crates.io (cargo-deny: path dependencies are fine)
publish = false

[workspace.dependencies]
btstack-sys = { path = "app/src/crates/btstack-sys" }
hci-transport = { path = "app/src/crates/hci-transport" }
# Members opt in to codecs: core takes "default", the others only what they use
codec = { path = "app/src/crates/codec", default-features = false }
bt-host = { path = "app/src/crates/bt-host" }
pipeline = { path = "app/src/crates/pipeline" }
a2dpwb-core = { path = "app/src/crates/core" }
win-sys = { path = "app/src/crates/win-sys" }
audio-capture = { path = "app/src/crates/audio-capture" }
ipc = { path = "app/src/crates/ipc" }
le-audio = { path = "app/src/crates/le-audio" }
lc3-sys = { path = "app/src/crates/lc3-sys" }
aptx-adaptive = { path = "app/src/crates/aptx-adaptive" }

cc = "1.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
crossbeam-channel = "0.5"
rtrb = "0.3"
arc-swap = "1.7"
thiserror = "2"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
debug = "line-tables-only"
lto = "thin"
codegen-units = 4
