name: Device compatibility report
description: '"It works with my headphones!" (or not) — every report helps'
labels: ["device report"]
body:
  - type: markdown
    attributes:
      value: |
        Tried BlueCaster with your gear? I'd love to hear how it went! 🎧
        "It just works" reports are super helpful too, especially for the experimental codecs (aptX HD, aptX Low Latency, Opus).
        Just check what you tried and leave the rest blank. If something is clearly broken, a [bug report](https://github.com/SeiyaFunaokaJP/BlueCaster/issues/new?template=bug_report.yml) is a better fit.

  - type: input
    id: version
    attributes:
      label: BlueCaster version
      description: Shown in Settings → About BlueCaster.
      placeholder: e.g. 2.0.0
    validations:
      required: true

  - type: input
    id: adapter
    attributes:
      label: USB Bluetooth adapter
      description: Product name is enough. Chipset / VID:PID is a bonus if you happen to know it.
      placeholder: e.g. TP-Link UB500 (Realtek RTL8761B, 2357:0604)
    validations:
      required: true

  - type: input
    id: headphones
    attributes:
      label: Headphones / speaker
      placeholder: e.g. Sony WH-1000XM4
    validations:
      required: true

  - type: checkboxes
    id: works
    attributes:
      label: Codecs that worked
      description: Check each codec you confirmed plays audio correctly.
      options:
        - label: LDAC
        - label: aptX HD
        - label: aptX Low Latency
        - label: aptX
        - label: LHDC V5
        - label: Opus
        - label: AAC
        - label: SBC XQ
        - label: SBC
        - label: FastStream

  - type: checkboxes
    id: fails
    attributes:
      label: Codecs that did NOT work
      description: Offered by the headphones, but failed to connect, fell back, or had audio problems.
      options:
        - label: LDAC
        - label: aptX HD
        - label: aptX Low Latency
        - label: aptX
        - label: LHDC V5
        - label: Opus
        - label: AAC
        - label: SBC XQ
        - label: SBC
        - label: FastStream

  - type: textarea
    id: verification
    attributes:
      label: How did you confirm the codec?
      description: Totally optional. e.g. codec shown in a headphone app, Wireshark on an HCI capture (**Diagnostics → Start HCI Capture**), or just the codec BlueCaster shows on Home.

  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: |
        Dropouts, latency, stability, sample rate, impressions — anything you noticed.
        Logs are welcome. **Diagnostics → Copy Diagnostics** masks Bluetooth addresses; files from the log folder are not masked.
