name: Bug report
description: Something isn't working right? Let me know!
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report! 🙏
        Don't worry about getting everything perfect — fill in what you can, and "I don't know" is a perfectly fine answer.
        Rough reports are welcome, and I'll ask if I need more details.

  - type: input
    id: version
    attributes:
      label: A2DPWB version
      description: Shown in Settings → About A2DPWB.
      placeholder: e.g. 2.0.0

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Run `winver` to see it.
      placeholder: e.g. Windows 11 24H2 (build 26100)

  - type: input
    id: adapter
    attributes:
      label: USB Bluetooth adapter
      description: Product name is enough. Chipset / VID:PID is a bonus if you happen to know it.
      placeholder: e.g. TP-Link UB500 (Realtek RTL8761B, 2357:0604)

  - type: input
    id: headphones
    attributes:
      label: Headphones / speaker
      placeholder: e.g. Sony WH-1000XM4

  - type: markdown
    attributes:
      value: |
        **Sound drops out, stutters, or the connection is unstable?** Most such reports so far were the radio, not the app: another radio next to the adapter, a second connection of the headphones, or a bit rate the link cannot carry. [Dropouts and connection problems](https://seiyafunaokajp.github.io/A2DP-Windows-Bridge/wireless) explains each check. Please try them first if you can, and tick what you tried below.

  - type: checkboxes
    id: checked
    attributes:
      label: What I tried
      description: For dropouts and connection problems. Leave it empty if the problem is something else.
      options:
        - label: Turned off every other Bluetooth adapter in this PC (the built-in one, for example)
        - label: Turned off dual connection (multipoint) in the headphones' app, or disconnected the phone, and closed the headphones' app
        - label: Moved the adapter to a USB 2.0 port or a short extension cable, away from USB 3 ports and other wireless receivers (mouse, keyboard, headset dongles)
        - label: Put this PC on 5 or 6 GHz Wi-Fi, or set AFH to Manual with the router's 2.4 GHz channel
        - label: Tried a lower bit rate (or ABR on), and checked whether the problem stays with SBC or AAC
        - label: Looked at Diagnostics > Link Quality while it happened (signal, send queue, packets dropped)

  - type: dropdown
    id: dual_connection
    attributes:
      label: Dual connection
      description: Were the headphones connected to a second device at the same time? A phone, or this PC's own Bluetooth, counts, also when it is only there for the headphones' app (battery, noise control, EQ).
      options:
        - "No"
        - "Yes"
        - I don't know

  - type: dropdown
    id: other_adapter
    attributes:
      label: Another Bluetooth adapter
      description: Was another Bluetooth adapter active in this PC, such as the built-in one?
      options:
        - "No"
        - "Yes"
        - I don't know

  - type: dropdown
    id: wifi
    attributes:
      label: Wi-Fi
      description: Which Wi-Fi was this PC on?
      options:
        - 2.4 GHz
        - 5 or 6 GHz
        - None (wired or off)
        - I don't know

  - type: dropdown
    id: codec
    attributes:
      label: Codec
      description: The codec you selected (or Auto).
      options:
        - Auto
        - LDAC
        - aptX HD
        - aptX Low Latency
        - aptX
        - LHDC V5
        - Opus
        - AAC
        - SBC XQ
        - SBC
        - FastStream
        - Not relevant / didn't get that far

  - type: dropdown
    id: capture_mode
    attributes:
      label: Capture mode
      options:
        - System Loopback
        - Virtual Device
        - Application
        - Not relevant

  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - Window / tray
        - CLI (a2dpwb-core.exe --cli)

  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: What you expected, and what actually happened. A short description is fine.

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: If you can. Skip it if it happened out of nowhere.
      placeholder: |
        1. Select adapter ...
        2. Connect to ...
        3. ...

  - type: textarea
    id: logs
    attributes:
      label: Diagnostics / log
      description: |
        Optional, but it helps a lot.

        1. Reproduce the problem.
        2. Open **Diagnostics** and click **Copy Diagnostics** (version, adapter, connection flow and recent log; Bluetooth addresses are masked by default), then paste it here.
        3. Attach the diagnostic bundle in the next field.
      render: text

  - type: textarea
    id: bundle
    attributes:
      label: Diagnostic bundle
      description: |
        A2DPWB depends a lot on the exact adapter, firmware and headphones, so this is the most useful part of a report.

        1. Open **Diagnostics → Report a problem** and set **Verbose logging** to **Detailed (debug)** (it turns itself off after 24 hours).
        2. Reproduce the problem.
        3. Click **Diagnostic bundle → Save…**, choose what goes in, then **Report on GitHub**: it opens this form with the version, Windows, adapter, headphones, codec and the diagnostic info filled in, and shows the `.zip` in Explorer. Drag the file into this field.

        The bundle holds the logs, crash reports, system information (adapters, drivers, audio devices) and, if you include them, HCI captures (the last minutes of Bluetooth traffic, saved automatically when a connection fails). Bluetooth addresses are masked in the text files; the HCI captures keep them, but not the pairing keys. GitHub takes files up to 25 MB. If you'd rather not post it publicly, email it instead (address on the maintainer's GitHub profile).

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, other adapters or headphones you tried, etc.
